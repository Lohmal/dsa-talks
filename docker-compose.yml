services:
  web:
    build:
      context: .
      args:
        # Read from .env; the address the site is reached at, e.g. https://dsatalks.atu.edu.tr
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: dsa-talks-web
    container_name: dsa-talks-web
    ports:
      - "3000:3000"
    # DATABASE_URL, AUTH_SECRET and the SMTP settings (Google Workspace app password) come from .env.
    env_file: .env
    environment:
      AUTH_TRUST_HOST: "true"
    restart: unless-stopped
